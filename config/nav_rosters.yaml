# DEFAULT: static roster. Published once (latched) by job_roster with state_source static.
# Run: ros2 run oomwoo_health_kit job_roster --ros-args -p config_file:=<this file>
#
# Why static: with "hold last setpoint" MCU semantics a robot that moves while the roster says "idle" is unsupervised.
# Docking, wall-follow, coverage, recovery and teleop all publish cmd_vel outside the two Nav2 actions, so a roster
# that follows the Nav2 job state can be wrong exactly when it matters. drive_supervision is satisfied while the robot
# is stationary and while commands accompany motion, so it needs no job state and nothing goes silent by design.
# max_age_sec: about 3 heartbeat periods (see nav_watch.yaml). Plumbing liveness: if the topic_heartbeat process dies
# every component below goes stale and the robot stops.
state_source: {type: static}

rosters:
  nav:
    task_id: nav
    components:
      - {component_id: lidar,             critical: true,  max_age_sec: 0.6}    # 5 Hz
      - {component_id: odom,              critical: true,  max_age_sec: 0.15}   # 50 Hz, unlimited (7 periods)
      - {component_id: localization,      critical: true,  max_age_sec: 1.0}    # rate unmeasured, conservative guess
      - {component_id: drive_supervision, critical: true,  max_age_sec: 0.15}   # emitted at up to 25 Hz
      - {component_id: local_costmap,     critical: false, max_age_sec: 0.6}    # 5 Hz
      - {component_id: global_costmap,    critical: false, max_age_sec: 1.5}    # 2 Hz
