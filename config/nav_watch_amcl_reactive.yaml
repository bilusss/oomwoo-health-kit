# VARIANT for the reactive coverage executor (M7 proposal, NOT a tuned default): identical to nav_watch_amcl.yaml except cmd_max_age_s 0.30.
# Reason (measured, results/fullstack/m7_recon/rates_coverage_reactive.json): while coverage_planner executor:=reactive drives /cmd_vel itself
# the command stream has a 200 ms period (p95 201 ms, max 405 ms; Nav2's chain is 20 Hz, p95 60 ms), so a freshness window of 0.15 s is
# shorter than the commander's period and drive_supervision withholds the heartbeat between commands (74 soft stops in 30 min with
# nav_watch_amcl.yaml). 0.30 s = 1.5 periods of the measured 5 Hz. Cost: a dead commander is detected up to 0.15 s later.
# Watches for the M7 AMCL stack (nav_amcl, coverage, coverage_reactive, recovery tasks of bench/fullstack): oomwoo_one, living_room,
# oomwoo_clean nav.launch.py = nav2_bringup bringup_launch.py (map_server + AMCL + the FULL Nav2: controller, smoother_server,
# planner, behavior_server, bt_navigator, velocity_smoother, collision_monitor, docking_server, route_server, waypoint_follower;
# ONE composed nav2_container, or one process per node with composition:=false), one ros_gz_bridge, MCU stand-in on the last cmd_vel hop.
# Roster: config/nav_rosters_amcl.yaml (static). Every row was checked on the live graph (docs/M7_RECON.md, graph_facts.py,
# probe_rates.py, RTF 1.0, 2026-11-14). Differences to nav_watch_sim.yaml (slam_toolbox stack):
#  - localization = map->odom published by amcl (one of THREE writers of /tf: ros_gz_bridge, robot_state_publisher, amcl; a tf watch
#    has no writer guard). New stamps 5.0 Hz both driving and stationary (AMCL sends the transform from its scan callback, so the
#    stamp advances per scan even when the filter does not update); /amcl_pose is 4.8 Hz moving and SILENT stationary (not usable).
#  - /cmd_vel has 2 writers at rest (collision_monitor, docking_server) and a third with the reactive coverage executor
#    (coverage_planner publishes /cmd_vel directly); drive_supervision counts any writer by design.
#  - global_costmap footprint is 2.0 Hz here (5.0 Hz on the slam stack): its roster max_age is 1.5 s (3 periods).
#  - lidar, odom, local_costmap: same signals and rates as on the slam stack (5 Hz, 50 Hz, 5 Hz).
# Health nodes on WALL time; no header-stamp checks (see nav_watch_sim.yaml).
watches:
  - component_id: lidar
    topic: /scan
    type: sensor_msgs/msg/LaserScan

  - component_id: odom
    topic: /odom
    type: nav_msgs/msg/Odometry
    max_emit_hz: 50

  - component_id: localization
    tf: {parent: map, child: odom}      # no writer guard on tf watches: a second writer of the pair is not detected
    max_emit_hz: 10

  # cmd_topic = what the stand-in receives (cmd_vel_in remapped to /cmd_vel): the last hop before the gate, any writer counts
  # (max_publishers is not applied to it). Today only collision_monitor writes it; /cmd_vel_nav has 6 writers (controller_server,
  # 5x behavior_server), /cmd_vel_smoothed 1: neither is the last hop.
  # Drive supervision (default critical). Tracks the SETPOINT the MCU holds (last value on cmd_topic). Beats only if a command
  # newer than cmd_max_age_s exists, or the held setpoint is zero (or none was ever seen) and odom has been below the
  # thresholds for settle_s, or less than coast_max_s passed since the setpoint became zero (coasting). A non-zero held setpoint
  # with no fresh command never beats whatever odom says (held creep command, stalled wheels with live odometry).
  # cmd_topic must be the topic the MCU stand-in receives (the last hop; any writer counts, max_publishers is not applied).
  # Proves: some fresh command exists whenever a non-zero setpoint is held, and the robot is not moving without a setpoint.
  # Does NOT prove the command is right, or that the wheels follow it (odom here is ground truth in the sim).
  - component_id: drive_supervision
    max_emit_hz: 25
    motion_consistency:
      odom_topic: /odom
      cmd_topic: /cmd_vel
      linear_threshold: 0.02
      angular_threshold: 0.05
      cmd_max_age_s: 0.30
      odom_max_age_s: 0.3
      settle_s: 0.1                     # odom below the thresholds this long = settled (zero or unknown setpoint)
      coast_max_s: 0.5                  # zero setpoint: odom may stay above the thresholds this long. Data: Nav2 flows had 0 uncommanded motion in 104 goals; Gazebo coast after a zero command about 0.12 s (5 trials)

  - component_id: local_costmap
    topic: /local_costmap/published_footprint
    type: geometry_msgs/msg/PolygonStamped

  - component_id: global_costmap
    topic: /global_costmap/published_footprint
    type: geometry_msgs/msg/PolygonStamped
